name: vena

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vena
      POSTGRES_PASSWORD: vena
      POSTGRES_DB: vena
    volumes:
      - vena-postgres:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:${VENA_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vena -d vena"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      VENA_ML_DIR: /srv/ml
      VENA_INBOX_DIR: /srv/ml/inbox
      VENA_DATABASE_URL: postgresql+psycopg://vena:vena@db:5432/vena
      VENA_ENVIRONMENT: local
      VENA_CORS_ORIGINS: '["http://localhost:3100"]'
      VENA_PUBLIC_URL: http://localhost:3100
      VENA_TIMEZONE: ${VENA_TIMEZONE:-Europe/Moscow}
      VENA_SEED_DEMO: ${VENA_SEED_DEMO:-false}
      VENA_PREDICTION_STALE_SECONDS: ${VENA_PREDICTION_STALE_SECONDS:-86400}
      VENA_AUTH_ENABLED: ${VENA_AUTH_ENABLED:-true}
      VENA_JWT_SECRET: ${VENA_JWT_SECRET:-local-development-only-change-this-secret-12345}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
    volumes:
      - ./ml/results:/srv/ml/results:ro
      - ./ml/configs:/srv/ml/configs:ro
      - ./ml/artifacts:/srv/ml/artifacts:ro
      - ./ml/inbox:/srv/ml/inbox
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      network: host
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8100
        NEXT_PUBLIC_VENA_DATA_MODE: demo
        NEXT_PUBLIC_VENA_WORKFLOW_MODE: api
        NEXT_PUBLIC_VENA_ENVIRONMENT: docker
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3100:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/pulse').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  vena-postgres:
