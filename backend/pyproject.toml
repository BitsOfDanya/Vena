[project]
name = "vena-backend"
version = "0.1.0"
description = "Vena HTTP API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
    "alembic>=1.20.0",
    "apscheduler>=3.11.0",
    "email-validator>=2.2.0",
    "psycopg[binary]>=3.2.0",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "openpyxl.*"]
ignore_missing_imports = true
